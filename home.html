<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator Dashboard</title>

    <link rel="stylesheet" href="./Css/Dashboard.css">
    <link rel="stylesheet" href="./Css/Navbar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="./Js/Navbar.js"></script>
</head>

<body data-active-page="home">

    <div id="navbar-placeholder"></div>

    <main class="dashboard-container">
        <h1>Welcome, [Name]</h1>

           <div class="stats-grid">
    <div class="bus-operator-card">
        <div class="card-top">
            <i class="fa-solid fa-bus"></i>
            <h3>Total Owned<br>Buses</h3>
        </div>
        <p class="stat-number" id="total-buses">0</p> 
    </div>

    <div class="bus-operator-card">
        <div class="card-top">
            <i class="fa-solid fa-dollar-sign"></i>
            <h3>Today's<br>Earnings</h3>
        </div>
        <p class="stat-number" id="earnings-display">LKR 0</p>
    </div>

    <div class="bus-operator-card">
        <div class="card-top">
            <i class="fa-solid fa-bus"></i>
            <h3>Active Buses</h3>
        </div>
        <p class="stat-number" id="active-buses">0</p>
    </div>

    <div class="bus-operator-card">
        <div class="card-top">
            <div class="icon-wrapper">
                <i class="fa-solid fa-bus-simple"></i>
                <i class="fa-solid fa-circle-exclamation alert-badge"></i>
            </div>
            <h3>Inactive Buses</h3>
        </div>
        <p class="stat-number" id="inactive-buses">0</p>
    </div>
</div>
    </main>

    <script src="./Js/Dashboard.js"></script>
</body>
</html>
