<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Buses - Obsidian Bus Tracking</title>
    <link rel="stylesheet" href="./Css/MyBuses.css">
    <link rel="stylesheet" href="./Css/Navbar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="./Js/Navbar.js"></script>
</head>

<body data-active-page="my-buses">

    <div id="navbar-placeholder"></div>

    <main class="page-container">       
        <div class="page-header">
            <button class="btn create-bus-btn" id="createBusBtn">
                <i class="fa-solid fa-plus"></i> Create Bus
            </button>
        </div>

        <div class="bus-list">
            <div class="bus-card">
                <div class="card-left">
                    <i class="fa-solid fa-bus bus-icon"></i>
                    <div class="bus-details">
                        <h3>Reg No: KV1415</h3>
                        <p>Route: 240</p>
                        <p>Model: Toyota Coaster 2011</p>
                        <p class="earnings"><strong>Earnings Today: LKR 30,000</strong></p>
                    </div>
                </div>
                <div class="card-right">
                    <div class="status-badge status-active">Active</div>
                    <div class="action-icons">
                        <i class="fa-solid fa-file-pen edit-icon" title="Edit"></i>
                        <i class="fa-solid fa-trash delete-icon" title="Delete"></i>
                    </div>
                </div>
            </div>

            <div class="bus-card">
                <div class="card-left">
                    <i class="fa-solid fa-bus bus-icon"></i>
                    <div class="bus-details">
                        <h3>Reg No: KV1415</h3>
                        <p>Route: Unassigned</p>
                        <p>Model: Toyota Coaster 2011</p>
                        <p class="earnings"><strong>Earnings Today:</strong></p>
                    </div>
                </div>
                <div class="card-right">
                    <div class="status-badge status-inactive">Inactive</div>
                    <div class="action-icons">
                        <i class="fa-solid fa-file-pen edit-icon" title="Edit"></i>
                        <i class="fa-solid fa-trash delete-icon" title="Delete"></i>
                    </div>
                </div>
            </div>

            <div class="bus-card">
                <div class="card-left">
                    <i class="fa-solid fa-bus bus-icon"></i>
                    <div class="bus-details">
                        <h3>Reg No: KV1415</h3>
                        <p>Route: 240</p>
                        <p>Model: Toyota Coaster 2011</p>
                        <p class="earnings"><strong>Earnings Today: LKR 24,500</strong></p>
                    </div>
                </div>
                <div class="card-right">
                    <div class="status-badge status-active">Active</div>
                    <div class="action-icons">
                        <i class="fa-solid fa-file-pen edit-icon" title="Edit"></i>
                        <i class="fa-solid fa-trash delete-icon" title="Delete"></i>
                    </div>
                </div>
            </div>
        </div>
    </main>   
    
    <div id="createBusModal" class="modal-overlay">
        <div class="modal-content">
            <h2>Create Bus</h2>
            <form id="createBusForm">
                <div class="modal-form-group">
                    <label for="busName">Bus Name</label>
                    <input type="text" id="busName" name="busName">
                </div>
                
                <div class="modal-form-group">
                    <label for="busModel">Model</label>
                    <input type="text" id="busModel" name="busModel">
                </div>
                
                <div class="modal-form-group">
                    <label for="regNo">Registration No</label>
                    <input type="text" id="regNo" name="regNo">
                </div>
                
                <div class="modal-form-group">
                    <label for="capacity">Capacity</label>
                    <input type="number" id="capacity" name="capacity">
                </div>

                <div class="modal-actions">
                    <button type="submit" class="btn modal-btn-blue">Create Bus</button>
                    <button type="button" id="closeModalBtn" class="btn modal-btn-red">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="./Js/MyBuses.js"></script>
</body>
</html>
